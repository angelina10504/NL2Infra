name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CONFTEST_VERSION: "0.71.1"

jobs:
  # Deterministic gates. These are the ones that decide whether a PR is mergeable.
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff

    - name: Install conftest
      run: |
        curl -sSfL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
          | sudo tar -xz -C /usr/local/bin conftest
        conftest --version

    # Errors only (E9,F63,F7,F82) so existing style never fails the build.
    - name: Lint with ruff
      run: ruff check . --select E9,F63,F7,F82

    - name: Run unit & contract tests
      env:
        MOCK_MODE: "true"
      run: pytest tests/ -q

    # All 33 Rego tests run together; they share the base fixtures.
    - name: Rego policy tests
      run: conftest verify --policy policies

    # Report gate only -- the Gauntlet is the real enforcer, so this never fails the build.
    - name: Checkov on sample manifests
      run: checkov -d samples/manifests --compact --soft-fail

    - name: Offline benchmark smoke test
      env:
        MOCK_MODE: "true"
      run: python benchmarks/run_benchmark.py --dry-count

  # Advisory only: comments on the PR, never approves or merges, and can never block it.
  ai-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: AI risk review (advisory, comment-only)
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: python .github/scripts/ai_review.py
