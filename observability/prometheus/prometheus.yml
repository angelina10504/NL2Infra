global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "nl2infra"
    metrics_path: /metrics
    static_configs:
      # The NL2Infra app runs on the host, outside this compose network.
      - targets: ["host.docker.internal:8000"]
