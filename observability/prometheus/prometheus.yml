global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "nl2infra"
    metrics_path: /metrics
    static_configs:
      # The app runs in the same compose network (compose.yaml), reached by service name.
      - targets: ["app:8000"]
  - job_name: "trace-latency"
    static_configs:
      - targets: ["collector:8889"]
