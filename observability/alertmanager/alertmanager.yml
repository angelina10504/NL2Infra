route:
  receiver: nl2infra-dashboard
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: nl2infra-dashboard
    webhook_configs:
      # The app turns each firing alert into a dashboard notification (bell). The webhook
      # needs the shared bearer token, mounted as a compose secret (never in this file).
      - url: "http://app:8000/alerts/webhook"
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/alert_webhook_token
