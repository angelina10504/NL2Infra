apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-report
  namespace: dev
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
          containers:
            - name: report
              image: ghcr.io/acme/report:2.1.0
              resources:
                limits:
                  cpu: 250m
                  memory: 128Mi
