apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: dev
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
      containers:
        - name: migrate
          image: ghcr.io/acme/migrate:1.0.0
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
