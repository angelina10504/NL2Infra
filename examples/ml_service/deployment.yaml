apiVersion: apps/v1
kind: Deployment
metadata:
  name: classifier
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: classifier
  template:
    metadata:
      labels:
        app: classifier
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: model
          image: ghcr.io/acme/classifier:0.5.1
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: classifier
  namespace: dev
spec:
  selector:
    app: classifier
  ports:
    - port: 80
      targetPort: 8080
