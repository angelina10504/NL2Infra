apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: landing
  template:
    metadata:
      labels:
        app: landing
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: site
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: landing
  namespace: dev
spec:
  selector:
    app: landing
  ports:
    - port: 80
      targetPort: 8080
