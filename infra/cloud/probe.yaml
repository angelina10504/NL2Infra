# The Deploy stage's HTTP probe. NL2Infra runs `wget` inside this pod, so the request resolves
# the Service by cluster DNS and goes through it. The pod holds no Kubernetes credentials.
apiVersion: v1
kind: Namespace
metadata:
  name: nl2infra-probe
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: nl2infra-probe
spec:
  replicas: 1
  selector:
    matchLabels: {app: probe}
  template:
    metadata:
      labels: {app: probe}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: probe
        image: docker.io/prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
        command: ["/bin/sleep", "2147483647"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
