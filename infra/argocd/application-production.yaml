# ArgoCD Application for the production environment.
# Production is intentionally NOT auto-synced: a human promotes by syncing in the ArgoCD UI/CLI.
# Replace the repoURL with your own manifests repo before applying.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nl2infra-production
  namespace: argocd
spec:
  project: nl2infra
  source:
    repoURL: https://github.com/YOUR_GH_USERNAME/nl2infra-manifests.git
    targetRevision: main
    path: production
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    # No `automated:` block on purpose — production changes require a manual sync.
    syncOptions:
    - CreateNamespace=true
